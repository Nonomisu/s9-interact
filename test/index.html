/* S9 Interact' : accueil en grille, puis la journée d'un personnage, au thème khurdan.
   Barre de personnages fixée en bas (pouce) sur téléphone, colonne latérale sur PC.
   Thème unique sombre, repris des fiches ; chaque personnage redéfinit les jetons. */
:root {
  --bg: #1c1412; --surface: #261a17; --accent: #8e1f22; --gold: #c9a45c;
  --text: #e9dcc4; --dim: #a8977d; --rule: rgba(201,164,92,.28);
  --bar: rgba(14,11,10,.94);
  --display: "Cinzel", "Times New Roman", serif;
  --body: "Spectral", Georgia, serif;
  --ui: "Spectral", Georgia, serif;
  color-scheme: dark;
}
:root.t-s9 {
  --bg: #0a0717; --surface: #181034; --accent: #b24bff; --gold: #d4ff09;
  --text: #eee9ff; --dim: #a59cc8; --rule: rgba(170,130,255,.26); --bar: rgba(8,5,20,.94);
  --display: "Chakra Petch", "Segoe UI", sans-serif;
  --body: "IBM Plex Sans", "Segoe UI", sans-serif;
  --ui: "IBM Plex Sans", "Segoe UI", sans-serif;
  --mono: "Share Tech Mono", ui-monospace, monospace;
}
:root.t-home {
  --bg: #15141a; --surface: #1e1c24; --accent: #6d5a8a; --gold: #c8bba0;
  --text: #ebe6dc; --dim: #9d978c; --rule: rgba(200,187,160,.22); --bar: rgba(12,11,15,.94);
}
* { box-sizing: border-box; }
html { background: var(--bg); transition: background .3s; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 1.0625rem/1.55 var(--body);
  transition: background .3s, color .3s;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
@media (prefers-reduced-motion: reduce) { html, body { transition: none; } }
button, input, textarea { font: inherit; color: inherit; }

.layout { display: grid; min-height: 100%; }
@media (min-width: 52rem) { .layout { grid-template-columns: 15rem minmax(0, 1fr); } }

/* ---------- Navigation ---------- */
.nav {
  position: fixed; inset: auto 0 0 0; z-index: 20;
  background: var(--bar); backdrop-filter: blur(8px);
  border-top: 1px solid var(--rule);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.nav-filter { display: flex; gap: .3rem; padding: .5rem max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
.nav-filter button {
  background: none; border: 1px solid var(--rule); border-radius: 999px;
  padding: .15rem .7rem; font-size: .8rem; color: var(--dim); cursor: pointer;
}
.nav-filter.cats { overflow-x: auto; scrollbar-width: none; padding-top: .35rem; }
.nav-filter.cats button { flex: none; }
.nav-filter button[aria-pressed="true"] { color: var(--bg); background: var(--gold); border-color: var(--gold); }
.nav-list {
  list-style: none; margin: 0; display: flex; gap: .5rem; overflow-x: auto; scrollbar-width: none;
  padding: .55rem max(16px, env(safe-area-inset-right, 0px)) .65rem max(16px, env(safe-area-inset-left, 0px));
}
.nav-list li { flex: none; }
.chip {
  display: flex; align-items: center; gap: .4rem; cursor: pointer;
  padding: .45rem .8rem; border-radius: 999px; white-space: nowrap;
  border: 1px solid var(--c-rule); background: var(--c-bg); color: var(--c-text);
  font: 700 .82rem/1 var(--c-display); letter-spacing: .08em; text-transform: uppercase;
}
.chip .g { color: var(--c-gold); font-size: .75rem; }
.eg-svg { width: 1.15em; height: 1.15em; vertical-align: -.2em; filter: drop-shadow(0 0 3px color-mix(in srgb, currentColor 60%, transparent)); }
.chip .g .eg-svg { width: 1.35em; height: 1.35em; }
.kicker .eg-svg { width: 1.3em; height: 1.3em; vertical-align: -.3em; }
.onibi { width: .95em; height: 1.2em; vertical-align: -.2em; filter: drop-shadow(0 0 3px currentColor) drop-shadow(0 0 6px color-mix(in srgb, currentColor 55%, transparent)); }
.chip .g .onibi { width: 1.05em; height: 1.3em; }
.kicker .onibi { width: 1.1em; height: 1.35em; vertical-align: -.3em; }

.chip .dot { width: .45rem; height: .45rem; border-radius: 50%; background: var(--c-dim); opacity: .5; }
.chip .dot.done { background: #7fb069; opacity: 1; }
.chip[aria-current="true"] { border-color: var(--c-gold); box-shadow: 0 0 0 1px var(--c-gold) inset; }
.chip:focus-visible, button:focus-visible, input:focus-visible, textarea:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.nav-group, .nav-list li.dup { display: none; }
@media (min-width: 52rem) {
  .nav {
    position: sticky; top: env(safe-area-inset-top, 0px); inset: auto; height: 100vh; overflow-y: auto;
    border-top: 0; border-right: 1px solid var(--rule); padding: 1.25rem 0;
  }
  .nav-filter { flex-wrap: wrap; padding: 0 1rem .75rem; }
  .nav-list { flex-direction: column; overflow: visible; padding: 0 1rem; gap: .35rem; }
  .nav-list li.dup { display: block; }
  .nav-group { display: block; margin: .8rem 0 .1rem; font: 500 .68rem/1 var(--ui); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); }
  .chip { width: 100%; border-radius: 6px; }
  .chip .dot { margin-left: auto; }
}

/* ---------- Contenu ---------- */
main {
  padding-block: 1.5rem 13rem;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
@media (min-width: 52rem) { main { padding-block: 2.5rem 4rem; } }
.wrap { max-width: 40rem; margin: 0 auto; display: grid; gap: 1.6rem; }
/* Animation météo de l'accueil : canvas hors du flux (aucun décalage), derrière le contenu, jamais cliquable. */
#view.fx-on { position: relative; overflow: hidden; }
#view.fx-on > :not(.wx-fx) { position: relative; }
.wx-fx { position: absolute; top: 0; left: 0; pointer-events: none; z-index: 0; border-radius: inherit; }
.fx-toggle { justify-self: center; font-size: .85rem; color: var(--dim); }
.fx-toggle small { font-size: .78rem; }
.preview-note {

}
h1 { margin: 0; font: 700 clamp(2rem, 8vw, 3.2rem)/1.05 var(--display); letter-spacing: .05em; text-wrap: balance; }

.kicker { margin: 0 0 .5rem; font: 500 .74rem/1 var(--display); letter-spacing: .28em; text-transform: uppercase; color: var(--gold); }

h2 {

}
h2::after { content: ""; flex: 1; height: 1px; background: var(--rule); }
section { display: grid; gap: .7rem; }

textarea, input[type=text] {
  width: 100%; background: var(--surface); border: 1px solid var(--rule); border-radius: 6px;
  padding: .7rem .85rem; color: var(--text); font-style: italic;
}
textarea { min-height: 4.5rem; resize: vertical; }
::placeholder { color: var(--dim); opacity: .8; }

/* La position de la page est gérée à chaque réaffichage (renderChar) : pas d'ancrage automatique du navigateur. */
html, body, #view { overflow-anchor: none; }

.link.ico-btn { display: inline-flex; align-items: center; justify-content: center; gap: .1rem; min-width: 2rem; min-height: 2rem; padding: .25rem .35rem;
  border: 1px solid var(--rule); border-radius: 999px; color: var(--gold); text-decoration: none; vertical-align: middle; background: transparent; }
.link.ico-btn:hover, .link.ico-btn:focus-visible { border-color: var(--gold); background: color-mix(in srgb, var(--gold) 10%, transparent); }

.night-kind { padding: .5rem .6rem .7rem; border: 1px solid var(--gold); border-radius: 8px; background: color-mix(in srgb, var(--gold) 7%, transparent); }

.act {

}

  background: none; color: var(--gold); font: inherit; font-size: .88rem; cursor: pointer; }

.battle-sub { margin: .5rem 0 0; font: 500 .72rem/1 var(--display); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.battle-joke { margin: 0; font-style: italic; color: var(--text); }
.shames { margin: 0; padding-left: 1.2rem; text-align: left; display: grid; gap: .3rem; }

.wrap-banner { display: flex; align-items: center; gap: .8rem; padding: .9rem 1rem; border-radius: 8px; border: 1px solid var(--gold);
  background: color-mix(in srgb, var(--gold) 12%, var(--surface)); flex-wrap: wrap; }

.wrap-banner div { display: grid; gap: .15rem; flex: 1; min-width: 12rem; }
.wrap-banner b { font: 500 .95rem/1.3 var(--display); color: var(--gold); letter-spacing: .04em; }
.wrap-banner span { font-size: .88rem; color: var(--dim); }
.wrap-hint { font-size: .82rem; font-style: italic; }
.wrap-open { display: flex; flex-wrap: wrap; gap: .4rem; }
.wrap { display: grid; gap: 1.2rem; padding: 1.6rem 1.3rem; border-radius: 10px; text-align: center;
  background: radial-gradient(ellipse at 50% 0%, color-mix(in srgb, var(--accent) 45%, transparent), transparent 70%), var(--surface);
  border: 1px solid var(--gold); }
.wrap .stats-list { text-align: left; }

.wrap-big { display: grid; grid-template-columns: repeat(auto-fit, minmax(6.5rem, 1fr)); gap: .6rem; }
.wrap-big div { display: grid; gap: .2rem; padding: .7rem .4rem; border: 1px solid var(--rule); border-radius: 8px; }
.wrap-big b { font: 700 1.8rem/1 var(--display); color: var(--gold); font-variant-numeric: tabular-nums; }
.wrap-big span { font-size: .8rem; color: var(--dim); }
.arc { display: grid; gap: .4rem; padding: .7rem .8rem; border: 1px solid var(--rule); border-radius: 6px; }
.arc.done { opacity: .7; }
.arc-head { display: flex; flex-wrap: wrap; align-items: center; gap: .3rem .8rem; }
.arc-head input[type=text] { flex: 1; min-width: 10rem; }
.arc-title { color: var(--text); flex: 1; min-width: 10rem; }

.arc-progress { font-size: .8rem; color: var(--gold); font-variant-numeric: tabular-nums; }
.arc-steps { list-style: none; margin: 0; padding: 0 0 0 1.4rem; display: grid; gap: .2rem; }
.arc-steps li { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.arc-steps .check-inline { color: var(--text); }
button.link.small { text-decoration: none; font-size: 1.1rem; line-height: 1; color: var(--dim); }
button.link.danger { color: #e0a24d; }
.arcs-done summary { cursor: pointer; color: var(--dim); font-size: .9rem; }
.arcs-done[open] { display: grid; gap: .5rem; }
.file-btn { display: inline-flex; align-items: center; gap: .45rem; justify-self: start; }
.file-btn .ico { width: 1.1rem; height: 1.1rem; }
.shot { margin: 0; display: grid; gap: .4rem; }
.shot img, .recap-shot { width: 100%; max-width: 100%; border-radius: 6px; border: 1px solid var(--rule); display: block; }
.more-regions { display: grid; gap: .4rem; }
.leg { display: grid; gap: .45rem; padding: .7rem .8rem; border: 1px solid var(--rule); border-radius: 6px; }
.leg h3 { margin: 0; font: 500 .72rem/1 var(--ui); letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.trip-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem; padding-left: 2.7rem; }
.trip-row label { display: flex; align-items: center; gap: .35rem; font-size: .85rem; color: var(--dim); }
.trip-row select { background: var(--surface); color: var(--text); border: 1px solid var(--rule); border-radius: 6px; padding: .3rem .5rem; font: inherit; font-size: .9rem; max-width: 100%; }
.trip-row.modes { gap: .3rem 1rem; }
.trip-row .arrow { color: var(--gold); }
.trip-row.dur { padding-left: 0; }
.trip-row.dur input { width: 4.5rem; }
.trip-sec h3 { margin-top: .8rem; }
.act span .ico { width: 1.1rem; height: 1.1rem; margin-right: .35rem; vertical-align: -.2em; color: var(--gold); }
.place-list.subs.deep { margin-left: .9rem; }
.place-list.subs { padding-left: .9rem; border-left: 1px solid var(--rule); }
.place-list button[aria-pressed="true"] { background: var(--gold); border-color: var(--gold); color: var(--bg); }
.place-list button[aria-pressed="true"] .ico { color: var(--bg); }
.where { margin: 0; display: flex; align-items: center; gap: .45rem; color: var(--text); font-style: italic; }
.where .ico { color: var(--gold); width: 1.2rem; height: 1.2rem; }
.recap {
  display: grid; gap: 1.2rem; padding: 1.6rem 1.4rem;
  border: 1px solid var(--gold); border-radius: 8px; background: var(--surface);
  box-shadow: 0 0 0 4px var(--bg), 0 0 0 5px var(--rule);
}
.recap-head { display: grid; justify-items: center; text-align: center; }
.recap-head .day-info { justify-content: center; justify-self: stretch; }
/* Capture d'image (Discord, « Image du récap ») : l'outil recopie les largeurs et hauteurs au pixel près.
   Si le texte rend un poil plus large dans la copie, une ligne ajustée au plus juste passe à la ligne
   et déborde sur le bloc suivant. D'où une largeur pleine pour la ligne de puces et des puces qui ne se coupent pas. */
.recap.capturing .day-info > span { white-space: nowrap; }
.recap-mood {
  margin: 0; text-align: center; font-style: italic; font-size: 1.15rem; line-height: 1.5; color: var(--text);
  padding-block: .9rem; border-block: 1px solid var(--rule);
}
.recap-mood::before { content: "« "; color: var(--gold); }
.recap-mood::after { content: " »"; color: var(--gold); }
.recap .where { justify-content: center; }
.recap-list { list-style: none; margin: 0; padding: 0; display: grid; gap: .55rem; }
.recap-list li { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: .8rem; align-items: baseline; }
.recap-when { display: inline-flex; align-items: center; gap: .4rem; justify-content: flex-end; font: 500 .74rem/1.2 var(--display); letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.recap-when .ico { width: 1.15rem; height: 1.15rem; align-self: center; }
.recap-what { min-width: 0; }
@media (max-width: 26rem) { .recap-list li { grid-template-columns: 1fr; gap: .1rem; } .recap-when { justify-content: flex-start; } }
.foot-btns { display: flex; flex-wrap: wrap; gap: .5rem; }
.foot-btns .ico { width: 1rem; height: 1rem; margin-right: .35rem; vertical-align: -.15em; }
.png-out:empty { display: none; }
.recap.capturing .recap-foot { display: none; }
.png-fig { margin: 0; display: grid; gap: .5rem; }
.png-fig img { width: 100%; border: 1px solid var(--rule); border-radius: 8px; }
.png-fig figcaption { font-size: .85rem; color: var(--dim); font-style: italic; }
.png-fig a { color: var(--gold); }
.recap-foot { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .6rem; padding-top: .8rem; border-top: 1px solid var(--rule); font-size: .88rem; color: var(--dim); font-style: italic; }
.day-info:empty { display: none; }
.wx-toggle { margin-top: .7rem; }
.day-info small { color: var(--dim); font-style: italic; font-size: .8rem; }
.card .wx { display: inline-flex; align-items: center; gap: .3rem; font-size: .8rem; color: var(--c-text); }
.card .wx .ico { color: var(--c-gold); }
.card .state { font-size: .82rem; color: var(--c-dim); font-style: italic; }
.card .state.done { color: #9cc98a; font-style: normal; }
.card.soon { opacity: .5; cursor: default; border-style: dashed; }
/* S9-MODULES-CSS (début) */
/* ---------- Modules S9 Interact' : Flash Actu, Wondereye, Pixel Meet (inséré par dev/s9-insert.py) ---------- */
.s9-mini { display: inline-flex; align-items: center; gap: .35rem; padding: .4rem .7rem; font-size: .72rem; }
.s9-mini .ico { width: .95rem; height: .95rem; }
/* Fenêtre par-dessus la page : rien ne bouge dessous (pas de saut de page) */
.s9-back { position: fixed; inset: 0; z-index: 60; background: rgba(4, 2, 12, .74); backdrop-filter: blur(3px); display: grid; align-items: end; justify-items: center; }
@media (min-width: 52rem) { .s9-back { align-items: center; } }
.s9-sheet { width: min(100%, 32rem); max-height: 92vh; overflow-y: auto; display: grid; gap: .85rem; background: var(--surface); color: var(--text);
  border-top: 2px solid var(--gold); padding: 1.1rem 1.1rem calc(1.2rem + env(safe-area-inset-bottom, 0px));
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 0 100%); }
.s9-sheet.s9-pink { border-top-color: #ff3d9a; }
.s9-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
.s9-row h2::after { display: none; }
.s9-field { display: grid; gap: .35rem; }
.s9-field > span { font: .7rem/1 var(--mono, monospace); letter-spacing: .16em; text-transform: uppercase; color: var(--dim); }
.s9-field input, .s9-field textarea { font-size: 16px; }
.s9-field textarea { min-height: 4.5rem; }
.s9-pick { display: grid; place-items: center; min-height: 7rem; border: 1px dashed var(--rule); color: var(--dim); cursor: pointer; text-align: center; padding: .6rem; }
.s9-pick.sm { min-height: 4rem; }
.s9-pick span { display: grid; justify-items: center; gap: .35rem; }
.s9-pick .ico { width: 1.6rem; height: 1.6rem; color: var(--gold); }
.s9-pick img { max-width: 100%; max-height: 14rem; display: block; }
.s9-pick small { font-size: .75rem; }

/* Flash Actu */
.s9-flash { gap: 0; border: 1px solid color-mix(in srgb, var(--gold) 45%, transparent); background: color-mix(in srgb, var(--gold) 4%, var(--surface));
  clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px)); }
.s9-flash-head { display: flex; align-items: center; gap: .6rem; padding: .75rem .9rem .55rem; }
.s9-flash-head h2 { flex: 1; color: var(--gold); }
.s9-flash-head h2::after { display: none; }
.s9-live { font: 700 .7rem/1 var(--mono, monospace); letter-spacing: .14em; padding: .25rem .45rem; background: #ff2f4f; color: #fff; animation: s9blink 1.6s steps(2) infinite; }
@keyframes s9blink { 50% { opacity: .55; } }
.s9-ticker { overflow: hidden; border-block: 1px solid color-mix(in srgb, var(--gold) 30%, transparent); background: color-mix(in srgb, var(--gold) 7%, transparent); }
.s9-track { display: flex; width: max-content; animation: s9tick 38s linear infinite; }
.s9-track span { white-space: nowrap; padding: .45rem 1.6rem .45rem 0; font: .82rem/1.2 var(--mono, monospace); }
.s9-track b { color: var(--gold); font-weight: 400; margin-right: .5rem; }
@keyframes s9tick { to { transform: translateX(-50%); } }
.s9-flash-list { display: grid; }
.s9-flash-item { padding: .8rem .9rem .9rem; display: grid; gap: .3rem; }
.s9-flash-item + .s9-flash-item { border-top: 1px solid var(--rule); }
.s9-flash-item strong { font: 700 1.1rem/1.25 var(--display); }
.s9-flash-item p { margin: 0; }
.s9-cat { font: .68rem/1 var(--mono, monospace); letter-spacing: .16em; text-transform: uppercase; color: var(--gold); }
.s9-by { font: .72rem/1.3 var(--mono, monospace); color: var(--dim); }
.s9-more { padding: 0 .9rem .9rem; }
.s9-more summary { cursor: pointer; font: .72rem/1 var(--mono, monospace); letter-spacing: .12em; color: var(--dim); text-transform: uppercase; }
.s9-more ul { list-style: none; margin: .6rem 0 0; padding: 0; display: grid; gap: .4rem; font-size: .88rem; }
.s9-more small { color: var(--dim); }
.s9-flash > .reserved { padding: 0 .9rem .9rem; margin: 0; }
@media (prefers-reduced-motion: reduce) { .s9-track, .s9-live { animation: none; } .s9-track { width: auto; flex-wrap: wrap; } .s9-track .dup { display: none; } }

/* Wondereye */
.we-logo { margin: 0; text-transform: none; letter-spacing: -.01em; font: 700 clamp(2.2rem, 9vw, 3rem)/1 "Comfortaa", var(--display);
  background: linear-gradient(90deg, #2b8cff, #b24bff 45%, #ff2fa6 75%, #ff8a1f); -webkit-background-clip: text; background-clip: text; color: transparent; }
.we-logo.sm { font-size: 1rem; }
.we-as { display: grid; gap: .35rem; font-size: .8rem; color: var(--dim); }
.we-stories { display: flex; gap: .8rem; overflow-x: auto; scrollbar-width: none; padding: .3rem .1rem; }
.we-story { flex: none; display: grid; justify-items: center; gap: .3rem; width: 4.2rem; background: none; border: 0; color: var(--text); font-size: .7rem; cursor: pointer; padding: 0; }
.we-story span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.we-story .we-av { width: 3.4rem; height: 3.4rem; font-size: 1.1rem; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c), 0 0 12px var(--c); }
.we-av { flex: none; width: 2.4rem; height: 2.4rem; border-radius: 50%; overflow: hidden; display: grid; place-items: center;
  font: 700 .95rem/1 "Comfortaa", var(--display); color: #0a0717; background: linear-gradient(140deg, var(--c), color-mix(in srgb, var(--c) 40%, #0a0717)); }
.we-av img { width: 100%; height: 100%; object-fit: cover; }
.we-av.pro { border-radius: 28%; }
.we-av.lg { width: 5rem; height: 5rem; font-size: 1.8rem; box-shadow: 0 0 0 2px var(--bg), 0 0 0 4px var(--c), 0 0 18px var(--c); }
.we-post { border: 1px solid color-mix(in srgb, var(--c) 40%, transparent); background: var(--surface); }
.we-head { display: flex; align-items: center; gap: .65rem; padding: .7rem .85rem; }
.we-who { display: grid; line-height: 1.25; min-width: 0; flex: 1; }
.we-who > span { font-size: .78rem; color: var(--dim); }
.we-h { background: none; border: 0; padding: 0; color: var(--text); font: inherit; font-weight: 600; cursor: pointer; text-align: left; }
.we-pro { font: .62rem/1 var(--mono, monospace); letter-spacing: .12em; padding: .18rem .35rem; border: 1px solid var(--gold); color: var(--gold); }
.we-photo { display: block; width: 100%; max-height: 80vh; object-fit: cover; background: #000; }
.we-actions { display: flex; gap: .2rem; padding: .4rem .5rem 0; }
.we-ico { display: grid; place-items: center; width: 2.4rem; height: 2.4rem; background: none; border: 0; color: var(--text); cursor: pointer; }
.we-ico .ico { width: 1.45rem; height: 1.45rem; }
.we-ico:disabled { opacity: .35; cursor: default; }
.we-ico[aria-pressed="true"] { color: #ff2fa6; }
.we-ico[aria-pressed="true"] .ico { fill: currentColor; filter: drop-shadow(0 0 5px #ff2fa6); }
.we-body { padding: .2rem .9rem .9rem; display: grid; gap: .35rem; font-size: .93rem; overflow-wrap: anywhere; }
.we-likes { font-weight: 600; }
.we-time { font: .7rem/1 var(--mono, monospace); color: var(--dim); letter-spacing: .1em; text-transform: uppercase; }
.we-prof { display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: center; }
.we-prof h1 { font-size: clamp(1.6rem, 6vw, 2.2rem); }
.we-handle { margin: .2rem 0 0; font: .9rem/1.3 var(--mono, monospace); color: var(--c); }
.we-counts { display: flex; gap: 1rem; margin: .4rem 0 0; font-size: .85rem; color: var(--dim); }
.we-counts b { color: var(--text); }
.we-bio { margin: 0; }
.we-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; }
.we-grid img, .we-grid .we-txt { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: var(--surface); }
.we-grid .we-txt { padding: .5rem; font-size: .72rem; overflow: hidden; }

/* Pixel Meet */
.pm-logo { margin: 0; text-transform: none; font: 700 clamp(1.9rem, 8vw, 2.6rem)/1 "Silkscreen", var(--mono, monospace); letter-spacing: .02em;
  color: #fff; text-shadow: 3px 3px 0 #ff3d9a, -2px -2px 0 #2ff5dc; }
.pm-logo span { color: #ff3d9a; }
.pm-private { display: flex; gap: .4rem; align-items: flex-start; margin: .7rem 0 0; font: .75rem/1.4 var(--mono, monospace); color: #2ff5dc; }
.pm-private .ico { flex: none; margin-top: .1rem; }
.pm-card { border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); background: var(--surface); overflow: hidden; }
.pm-photo { position: relative; }
.pm-photo img { display: block; width: 100%; max-height: 70vh; object-fit: cover; }
.pm-photo span { position: absolute; left: .8rem; bottom: .8rem; padding: .25rem .5rem; background: rgba(10,7,23,.75); font: .8rem/1 "Silkscreen", var(--mono, monospace); }
.pm-body { padding: .9rem 1rem 1.1rem; display: grid; gap: .5rem; font-size: .92rem; }
.pm-name { display: block; text-transform: none; letter-spacing: .02em; color: var(--text); font: 700 1.4rem/1.15 var(--display); }
.pm-name::after { display: none; }
.pm-facts { display: flex; flex-wrap: wrap; gap: .35rem; margin: 0; }
.pm-facts span { padding: .25rem .5rem; border: 1px solid rgba(255,61,154,.45); font-size: .8rem; }
.pm-body dl { margin: 0; display: grid; gap: .3rem; }
.pm-body dt { font: .68rem/1 var(--mono, monospace); letter-spacing: .16em; text-transform: uppercase; color: #ff3d9a; margin-top: .3rem; }
.pm-body dd { margin: 0; }
.pm-bio { margin: .3rem 0 0; padding: .6rem .8rem; border-left: 3px solid #ff3d9a; background: rgba(255,61,154,.07); font-style: italic; }
.pm-inbox { list-style: none; margin: 0; padding: 0; display: grid; gap: .5rem; }
.pm-thread { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: .2rem .75rem; align-items: center; text-align: left; cursor: pointer;
  padding: .65rem .75rem; background: var(--surface); border: 1px solid var(--rule); color: var(--text); font: inherit; }
.pm-thread.unread { border-color: rgba(255,61,154,.7); box-shadow: inset 3px 0 0 #ff3d9a; }
.pm-thread .pm-px { grid-row: span 2; }
.pm-nm { font-weight: 600; font-size: .95rem; }
.pm-nm small { font-weight: 400; color: var(--dim); }
.pm-pv { grid-column: 2; font-size: .85rem; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pm-tm { grid-row: 1; grid-column: 3; font: .7rem/1 var(--mono, monospace); color: var(--dim); }
.pm-thread .pm-tone { grid-row: 2; grid-column: 3; justify-self: end; }
.pm-tone { font: .6rem/1 var(--mono, monospace); letter-spacing: .1em; padding: .18rem .35rem; border: 1px solid currentColor; }
.pm-tone.classique { color: #2ff5dc; } .pm-tone.taquin { color: #d4ff09; } .pm-tone.direct { color: #ff3d9a; }
.pm-px { width: 2.6rem; height: 2.6rem; image-rendering: pixelated; display: block; object-fit: cover; }
.pm-convo { gap: .6rem; }
.pm-head { display: grid; grid-template-columns: auto 1fr; gap: .15rem .8rem; align-items: center; }
.pm-head .pm-px { grid-row: span 2; width: 3.4rem; height: 3.4rem; }
.pm-head b { font: 700 1.1rem/1.2 var(--display); }
.pm-head span { font-size: .85rem; color: var(--dim); }
.pm-bub { max-width: 85%; padding: .6rem .8rem; font-size: .93rem; overflow-wrap: anywhere; white-space: pre-wrap; }
.pm-bub.them { justify-self: start; background: rgba(255,61,154,.13); border: 1px solid rgba(255,61,154,.45); }
.pm-bub.me { justify-self: end; background: rgba(47,245,220,.1); border: 1px solid rgba(47,245,220,.45); }
.pm-bub small { display: block; margin-top: .25rem; font: .68rem/1 var(--mono, monospace); color: var(--dim); }
.pm-slider { display: grid; grid-template-columns: 6rem 1fr 3rem; gap: .6rem; align-items: center; }
.pm-slider input { width: 100%; accent-color: #ff3d9a; }
.pm-slider output { font: .8rem/1 var(--mono, monospace); text-align: right; }
.nav .chip.app-chip { font-family: inherit; }

.pm-tabs { flex-wrap: wrap; }
.pm-tabs button { flex: 1 1 auto; }
#view > .s9-flash, #view > .we-post, #view > .pm-card, #view > .pm-convo, #view > .pm-inbox, #view > .pm-set, #view > .we-as, #view > .we-prof, #view > .we-bio { min-width: 0; text-align: left; }
.we-top, .pm-top { text-align: center; }

/* ================================================================ Habillage S9 (maquette d'ambiance) */
:root.t-s9 { --cut: 12px; --signal: #d4ff09; }
:root.t-s9 body {
  background:
    radial-gradient(120% 60% at 85% -10%, rgba(178, 75, 255, .2), transparent 60%),
    radial-gradient(90% 50% at -10% 30%, rgba(255, 47, 166, .09), transparent 60%),
    radial-gradient(80% 50% at 110% 90%, rgba(47, 245, 220, .07), transparent 60%),
    linear-gradient(180deg, #120c2a, var(--bg) 60%);
  background-attachment: fixed;
}
/* Lignes d'écran : très discrètes, jamais cliquables ; coupées par la case des effets ou si l'appareil demande moins d'animations */
:root.t-s9 body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 45;
  background: repeating-linear-gradient(0deg, rgba(255,255,255,.025) 0 1px, transparent 1px 3px); mix-blend-mode: overlay; }
